name: ui
description: Jobly tema i zajednički widgeti za Flutter klijente.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  design_tokens:
    path: ../design_tokens
  domain:
    path: ../domain
  flutter:
    sdk: flutter
  intl: 0.20.3

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
